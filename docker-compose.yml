version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mdias-postgres
    environment:
      POSTGRES_DB: mdias
      POSTGRES_USER: mdias
      POSTGRES_PASSWORD: mdias
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdias"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mdias-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  python-api:
    build:
      context: ./apps/python-api
      dockerfile: Dockerfile
    container_name: mdias-python-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://mdias:mdias@postgres:5432/mdias"
      REDIS_URL: "redis://redis:6379"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./apps/python-api:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
